<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyurular, İlanlar ve Sonuçlar | Fenerbahçe Üniversitesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="announcement.css">
</head>
<body>
  <script src="components.js" data-part="header"></script>
  <div class="page-header"><h1>Duyurular, İlanlar ve Sonuçlar</h1></div>
  <main class="call-wrap">
    <p class="call-lead">Erasmus+ ve Global Değişim başvurularını, dil sınavı duyurularını, değerlendirme sonuçlarını ve tamamlanan ilanların arşivini tek bir yerden takip edin.</p>
    <div class="call-master-tabs" role="tablist" aria-label="İçerik türü">
      <button type="button" role="tab" data-ann-tab="calls" aria-selected="true" class="is-active">Duyurular ve İlan Arşivi</button>
      <button type="button" role="tab" data-ann-tab="news" aria-selected="false">Haberler ve Etkinlikler</button>
    </div>
    <section id="announcementArchive" aria-label="Duyuru arşivi">
      <div class="call-controlbox">
        <label for="callSearch" class="sr-only" style="position:absolute;left:-10000px;">İlanlarda ara</label>
        <input id="callSearch" class="call-search" type="search" placeholder="İlan adı, akademik yıl, program veya anahtar kelime ara..." autocomplete="off">
        <div class="call-status-tabs" role="group" aria-label="İlan durumu">
          <button type="button" class="is-active" data-call-status="all" aria-pressed="true">Tüm İlanlar</button>
          <button type="button" data-call-status="open" aria-pressed="false">Açık / Yaklaşan</button>
          <button type="button" data-call-status="pending" aria-pressed="false">Değerlendirmede / Başvurusu Kapanmış</button>
          <button type="button" data-call-status="completed" aria-pressed="false">Tamamlananlar</button>
        </div>
        <div class="call-selects">
          <label for="callAudience">Başvuru sahibi<select id="callAudience"><option value="">Öğrenci ve personel</option><option value="student">Öğrenci</option><option value="staff">Personel</option></select></label>
          <label for="callProgram">Program<select id="callProgram"><option value="">Tüm programlar</option><option value="KA131">KA131</option><option value="KA171">KA171</option><option value="Global">Global Değişim</option></select></label>
          <label for="callYear">Akademik yıl<select id="callYear"><option value="">Tüm akademik yıllar</option></select></label>
          <label for="callMobility">Hareketlilik türü<select id="callMobility"><option value="">Tüm hareketlilikler</option><option value="studies">Öğrenim</option><option value="traineeship">Staj</option><option value="teaching">Ders Verme</option><option value="training">Eğitim Alma</option><option value="other">Diğer</option></select></label>
        </div>
      </div>
      <div class="call-result-info"><span id="callResultCount" aria-live="polite"></span><button id="callClear" class="call-clear" type="button">Filtreleri temizle</button></div>
      <div id="callResults" class="call-cards"></div><nav id="callPagination" class="call-page-nav" aria-label="Sayfalar"></nav>
    </section>
    <section id="newsArchive" hidden aria-label="Haberler ve etkinlikler"><div class="call-news-grid" data-render="news-archive"></div></section>
  </main>
  <script src="components.js" data-part="footer"></script>
  <script src="data/ilanlar.js"></script><script src="data/duyurular.js"></script><script src="render.js"></script><script src="announcements.js"></script><script src="script.js"></script>
</body>
</html>
