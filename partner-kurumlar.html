<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Kurumlar | UİDPM</title>
    
    <!-- Ortak Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tablo Widget'ı İçin Özel Fontlar -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Ortak CSS Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="components.js" data-part="header"></script>

    <!-- SAYFA BAŞLIĞI -->
    <div class="page-header">
        <h1>Partner Kurumlar</h1>
    </div>

    <!-- İÇERİK ALANI -->
    <div class="page-content" style="max-width: 1200px;">
        <h2>Erasmus+ Kurumlararası Anlaşmalar</h2>
        <p>Üniversitemizin Erasmus+ ve değişim programları kapsamında iş birliği yaptığı kurumları, kontenjan durumlarını ve dil gereksinimlerini aşağıdaki arama ve filtreleme araçlarını kullanarak inceleyebilirsiniz.</p>

        <!-- ==========================================================================
          ERASMUS+ ANLAŞMALARI WIDGET'I
          Sekmeler, filtreler, tablo başlığı ve arayüz metinleri partners-widget.js tarafından
          (TR/EN) oluşturulur; bu bloğu çevirmeye gerek yok.
        =========================================================================== -->
        <div class="fbe-agreements" id="fbeRoot">
            <div class="fbe-tabs" id="fbeTabs" role="tablist"></div>
            <div class="fbe-context" id="fbeContext" hidden></div>

            <div class="fbe-toolbar">
                <div class="fbe-search-box">
                    <input autocomplete="off" id="fbeSearch" type="text" />
                </div>
                <div class="fbe-filters" id="fbeFilters"></div>
            </div>

            <div class="fbe-list-header fbe-grid" id="fbeHeader"></div>

            <div class="fbe-list" id="fbeList"></div>
            <div class="fbe-empty" id="fbeEmpty"></div>
            <div class="fbe-toast" id="fbeToast"></div>
        </div>
    </div>

    <script src="components.js" data-part="footer"></script>

    <!-- Ortak JS Dosyası ve Menü İşlemleri -->
    <script src="script.js"></script>

    <script src="data/partners.js"></script>
    <script src="data/partners-staff.js"></script>
    <script src="data/agreements-public.js"></script>
    <script src="data/terms-en.js"></script>
    <script src="partners-widget.js"></script>
</body>
</html>
